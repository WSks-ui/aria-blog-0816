<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none">
  <style>
    /* 占位肖像的「雨场悬浮物」动效：星座极慢漂移，网格呼吸，碎片打转。
       静止帧与原静态图一致；以图像标签引用时由浏览器执行内嵌动画。 */
    .drift-a, .drift-b, .drift-c, .shard-a, .shard-b, .shard-c {
      transform-box: fill-box;
      transform-origin: center;
    }
    .drift-a { animation: umbrella-drift-a 22s ease-in-out -6s infinite alternate; }
    .drift-b { animation: umbrella-drift-b 27s ease-in-out -14s infinite alternate; }
    .drift-c { animation: umbrella-drift-c 19s ease-in-out -3s infinite alternate; }
    .web { animation: umbrella-web-breathe 9s ease-in-out infinite; }
    .shard-a { animation: umbrella-shard-a 16s ease-in-out -2s infinite alternate; }
    .shard-b { animation: umbrella-shard-b 21s ease-in-out -11s infinite alternate; }
    .shard-c { animation: umbrella-shard-c 18s ease-in-out -7s infinite alternate; }
    @keyframes umbrella-drift-a {
      from { transform: translate(0, 0) rotate(0deg); }
      to { transform: translate(6px, -5px) rotate(2.2deg); }
    }
    @keyframes umbrella-drift-b {
      from { transform: translate(0, 0) rotate(0deg); }
      to { transform: translate(-7px, 5px) rotate(-2.6deg); }
    }
    @keyframes umbrella-drift-c {
      from { transform: translate(0, 0) rotate(0deg); }
      to { transform: translate(5px, 6px) rotate(1.8deg); }
    }
    @keyframes umbrella-web-breathe {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.4; }
    }
    @keyframes umbrella-shard-a {
      from { transform: translate(0, -4px) rotate(-4deg); }
      to { transform: translate(2px, 12px) rotate(9deg); }
    }
    @keyframes umbrella-shard-b {
      from { transform: translate(0, 3px) rotate(5deg); }
      to { transform: translate(-3px, -11px) rotate(-7deg); }
    }
    @keyframes umbrella-shard-c {
      from { transform: translate(0, -6px) rotate(3deg); }
      to { transform: translate(-2px, 10px) rotate(12deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .drift-a, .drift-b, .drift-c, .shard-a, .shard-b, .shard-c, .web { animation: none; }
    }
  </style>
  <g stroke="#59b8cf" stroke-width="1.4" opacity=".36">
    <g class="drift-a">
      <path d="M104 87 60 62 25 103 44 151 95 150 116 105Z"/>
      <path d="m104 87-60 64M104 87l-9 63M104 87l12 18M104 87 60 62M104 87 25 103"/>
    </g>
    <g class="drift-b">
      <path d="m572 118-55-31-45 51 24 61 64-1 27-56Z"/>
      <path d="m572 118-76 81m76-81-12 80m12-80 15 24m-15-24-55-31m55 31-100 20"/>
    </g>
    <g class="drift-c">
      <path d="m339 349-50-28-40 46 21 55 58-1 24-51Z"/>
      <path d="m339 349-69 73m69-73-11 72m11-72 13 21m-13-21-50-28m50 28-90 18"/>
    </g>
  </g>
  <g class="web" stroke="#9bb6bd" stroke-width="1" opacity=".25">
    <path d="M104 87 339 349M572 118 339 349M104 87 572 118"/>
    <path d="M0 240h720M360 0v480"/>
  </g>
  <g fill="#f3f2ec" stroke="#55757e" stroke-width="1" stroke-linejoin="round" opacity=".68">
    <path class="shard-a" d="M189 75 204 77 208 91 197 101 184 92 185 81Z"/>
    <path class="shard-b" d="M428 258 438 259 441 268 433 274 425 268Z"/>
    <path class="shard-c" d="M631 359 650 362 655 379 640 390 624 379 626 367Z"/>
  </g>
</svg>
