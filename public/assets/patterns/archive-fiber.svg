<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" preserveAspectRatio="none">
  <defs>
    <!-- 低对比纸浆颗粒：提供印刷与扫描感，不使用动态滤镜。 -->
    <filter id="pulp" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".72 .88" numOctaves="3" seed="37" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .17 0 0 0 0 .34 0 0 0 0 .37 0 0 0 .17 0"/>
    </filter>
    <!-- 拉长的低频纹理模拟纸张纤维方向，避免噪点均匀地铺成数码灰。 -->
    <filter id="fiber" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .25" numOctaves="2" seed="73" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 .23 0 0 0 0 .43 0 0 0 0 .46 0 0 0 .11 0"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="480" height="480" fill="#f5f5ef" opacity=".16"/>
  <rect width="480" height="480" filter="url(#pulp)" opacity=".72"/>
  <rect width="480" height="480" filter="url(#fiber)" opacity=".46"/>
  <g fill="none" stroke="#589caf" stroke-linecap="round" opacity=".14">
    <path d="M-24 58c46-14 78 18 126 4s87-2 131 11 84-6 126-17 83 2 143-11"/>
    <path d="M-18 168c58 15 84-17 141-4s87 32 141 14 95-7 129 6 59 20 103 4"/>
    <path d="M-40 278c69-9 115 20 169 4s81-25 132-10 97 19 135-1 65-8 116 4"/>
    <path d="M-16 404c50-18 87 10 137-4s92-11 142 6 84 16 132-7 70-5 111-18"/>
  </g>
  <g fill="#fffdf6" opacity=".18">
    <circle cx="68" cy="116" r="2"/><circle cx="128" cy="333" r="1.5"/><circle cx="225" cy="72" r="1"/>
    <circle cx="304" cy="251" r="2"/><circle cx="389" cy="144" r="1.2"/><circle cx="442" cy="394" r="1.8"/>
  </g>
  <g fill="#72becd" opacity=".1">
    <ellipse cx="82" cy="70" rx="21" ry="8" filter="url(#soft)"/>
    <ellipse cx="392" cy="370" rx="34" ry="11" filter="url(#soft)"/>
  </g>
</svg>
