<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6f4ed" stop-opacity="0"/>
      <stop offset=".45" stop-color="#9adbe5" stop-opacity=".24"/>
      <stop offset="1" stop-color="#47b6cc" stop-opacity=".09"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop stop-color="#b9ecf1" stop-opacity=".44"/>
      <stop offset="1" stop-color="#a4dce5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#93d6e0" stop-opacity=".03"/>
      <stop offset=".52" stop-color="#5ebbd0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#dff7f2" stop-opacity=".02"/>
    </linearGradient>
    <filter id="blur-36" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="glass-noise" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .06" numOctaves="2" seed="14" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <pattern id="micro-grid" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M0 .5H128M.5 0V128" fill="none" stroke="#4b9cae" stroke-opacity=".11"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#micro-grid)"/>
  <ellipse cx="1150" cy="178" rx="420" ry="230" fill="url(#bloom)" filter="url(#blur-36)"/>
  <ellipse cx="490" cy="810" rx="390" ry="205" fill="url(#bloom)" opacity=".7" filter="url(#blur-36)"/>
  <path d="M-80 734C248 419 464 896 818 519S1261 393 1660 618" fill="none" stroke="#3c9fb6" stroke-width="2" stroke-opacity=".2"/>
  <path d="M-72 774C260 459 470 937 836 556S1289 432 1670 655" fill="none" stroke="#f8fbf8" stroke-width="1" stroke-opacity=".56"/>
  <path d="M122 0C153 172 107 259 152 421s-26 278 24 445M1010-28c-28 209 30 324-12 521s31 312-18 550M1402-25c25 180-31 310 13 480s-29 301 16 559" fill="none" stroke="#5daebe" stroke-width="2" stroke-opacity=".14" filter="url(#glass-noise)"/>
  <g filter="url(#glass-noise)">
    <rect x="-96" y="206" width="620" height="192" rx="4" fill="url(#glass)" transform="rotate(-8 214 302)"/>
    <rect x="755" y="274" width="742" height="236" rx="4" fill="url(#glass)" transform="rotate(7 1126 392)"/>
    <rect x="662" y="657" width="762" height="128" rx="4" fill="url(#glass)" transform="rotate(-4 1043 721)"/>
  </g>
  <!-- 不等边纸片替换规则方块，描边保持像素级轻薄以接近手绘档案碎片。 -->
  <g fill="#fbfaf2" stroke="#5b9cab" stroke-width="1" stroke-opacity=".34" stroke-linejoin="round">
    <path d="M238 161 251 160 256 172 248 181 235 174Z"/>
    <path d="M624 317 645 319 651 339 635 350 619 339 618 326Z"/>
    <path d="M1093 164 1102 165 1105 174 1097 180 1089 175Z"/>
    <path d="M1341 600 1357 603 1360 618 1347 625 1335 615 1337 606Z"/>
    <path d="M402 790 410 791 412 799 405 803 398 798Z"/>
  </g>
  <g stroke="#54adc0" stroke-width="1" stroke-opacity=".22" fill="none">
    <path d="M284 90h318M284 90v134M1032 821h360M1392 821V676"/>
    <path d="M924 130 1404 260 1190 443 786 331Z"/>
    <path d="M70 560 402 428l129 178-345 172Z"/>
  </g>
  <rect width="1600" height="1000" fill="url(#wash)"/>
</svg>
