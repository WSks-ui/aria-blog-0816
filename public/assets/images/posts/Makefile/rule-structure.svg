<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Makefile的第一行是依赖关系，第二行是依赖方法</title>
  <desc id="desc">vim里的两行Makefile规则，粉色标记分别指出依赖关系、依赖方法和Tab缩进</desc>
  <defs>
    <marker id="arrowPink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#d63c6e"/>
    </marker>
  </defs>
  <rect width="1400" height="420" fill="#f5f7f8"/>

  <rect x="80" y="60" width="900" height="320" rx="8" fill="#1b1f24"/>
  <rect x="80" y="340" width="900" height="40" fill="#323a45"/>
  <text x="104" y="366" fill="#9aa5b1" font-family="Consolas, monospace" font-size="18">"makefile" 2L, 41C</text>
  <text x="956" y="366" text-anchor="end" fill="#9aa5b1" font-family="Consolas, monospace" font-size="18">1,1  All</text>

  <text x="130" y="140" text-anchor="end" fill="#4b5563" font-family="Consolas, monospace" font-size="22">1</text>
  <text x="130" y="188" text-anchor="end" fill="#4b5563" font-family="Consolas, monospace" font-size="22">2</text>
  <text x="118" y="236" fill="#3d4650" font-family="Consolas, monospace" font-size="22">~</text>
  <text x="118" y="284" fill="#3d4650" font-family="Consolas, monospace" font-size="22">~</text>

  <text x="160" y="140" fill="#e8edf2" font-family="Consolas, monospace" font-size="24">mycode: mycode.c</text>
  <text x="208" y="188" fill="#e8edf2" font-family="Consolas, monospace" font-size="24">gcc -o mycode mycode.c</text>

  <ellipse cx="284" cy="130" rx="138" ry="32" transform="rotate(-2 284 130)" fill="none" stroke="#ff7ba0" stroke-width="3.5"/>
  <path d="M426 124C620 66 880 84 1004 112" fill="none" stroke="#d63c6e" stroke-width="3" marker-end="url(#arrowPink)"/>
  <text x="1030" y="124" fill="#d63c6e" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26">依赖关系</text>

  <path d="M208 206V218H525V206" fill="none" stroke="#ff7ba0" stroke-width="3"/>
  <path d="M530 216C700 264 880 246 1002 204" fill="none" stroke="#d63c6e" stroke-width="3" marker-end="url(#arrowPink)"/>
  <text x="1030" y="208" fill="#d63c6e" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26">依赖方法</text>

  <text x="548" y="188" fill="#ff7ba0" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20">← Tab 缩进</text>
</svg>
