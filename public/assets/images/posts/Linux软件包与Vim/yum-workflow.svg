<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">YUM安装软件包流程</title>
  <desc id="desc">YUM依次查询仓库、解析依赖、下载软件包并写入系统</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#596675"/>
    </marker>
  </defs>
  <rect width="1400" height="720" fill="#f5f7f8"/>
  <rect x="72" y="64" width="10" height="54" fill="#44b678"/>
  <text x="108" y="91" fill="#171a1f" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="34" font-weight="700">YUM安装软件包的四个阶段</text>
  <text x="108" y="128" fill="#66717d" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19">从用户请求到系统完成安装，依赖关系由包管理器统一处理</text>

  <!-- 四个步骤保持同宽，便于今后增加或调整阶段说明 -->
  <g transform="translate(72 212)">
    <rect width="280" height="290" rx="8" fill="#ffffff" stroke="#ced5dc" stroke-width="2"/>
    <rect width="280" height="12" rx="6" fill="#4d7cc7"/>
    <circle cx="48" cy="64" r="24" fill="#e8eef8"/>
    <text x="48" y="72" text-anchor="middle" fill="#4d7cc7" font-family="Arial, sans-serif" font-size="24" font-weight="700">1</text>
    <text x="88" y="70" fill="#171a1f" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">查询仓库</text>
    <rect x="34" y="112" width="212" height="66" rx="6" fill="#1b1f24"/>
    <text x="52" y="152" fill="#e8edf2" font-family="Consolas, monospace" font-size="17">yum install vim</text>
    <text x="34" y="218" fill="#596675" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">读取仓库元数据</text>
    <text x="34" y="252" fill="#596675" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">定位目标软件包</text>
  </g>

  <line x1="362" y1="357" x2="402" y2="357" stroke="#596675" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(412 212)">
    <rect width="280" height="290" rx="8" fill="#ffffff" stroke="#ced5dc" stroke-width="2"/>
    <rect width="280" height="12" rx="6" fill="#e96e5f"/>
    <circle cx="48" cy="64" r="24" fill="#fbe9e6"/>
    <text x="48" y="72" text-anchor="middle" fill="#e96e5f" font-family="Arial, sans-serif" font-size="24" font-weight="700">2</text>
    <text x="88" y="70" fill="#171a1f" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">解析依赖</text>
    <g fill="none" stroke="#e96e5f" stroke-width="3">
      <line x1="74" y1="134" x2="140" y2="112"/>
      <line x1="74" y1="134" x2="140" y2="160"/>
      <line x1="140" y1="112" x2="210" y2="134"/>
      <line x1="140" y1="160" x2="210" y2="134"/>
    </g>
    <g fill="#ffffff" stroke="#e96e5f" stroke-width="3">
      <circle cx="74" cy="134" r="15"/>
      <circle cx="140" cy="112" r="15"/>
      <circle cx="140" cy="160" r="15"/>
      <circle cx="210" cy="134" r="15"/>
    </g>
    <text x="34" y="218" fill="#596675" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">计算所需依赖</text>
    <text x="34" y="252" fill="#596675" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">生成本次事务清单</text>
  </g>

  <line x1="702" y1="357" x2="742" y2="357" stroke="#596675" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(752 212)">
    <rect width="280" height="290" rx="8" fill="#ffffff" stroke="#ced5dc" stroke-width="2"/>
    <rect width="280" height="12" rx="6" fill="#ffb347"/>
    <circle cx="48" cy="64" r="24" fill="#fff1dc"/>
    <text x="48" y="72" text-anchor="middle" fill="#c77613" font-family="Arial, sans-serif" font-size="24" font-weight="700">3</text>
    <text x="88" y="70" fill="#171a1f" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">下载软件包</text>
    <path d="M112 106H170V154H112Z" fill="#ffb347"/>
    <path d="M112 106L141 88L199 116L170 134Z" fill="#ffd18a"/>
    <path d="M170 134L199 116V164L170 182Z" fill="#dc8d2a"/>
    <path d="M66 188H214" stroke="#ffb347" stroke-width="8" stroke-linecap="round"/>
    <path d="M66 188H178" stroke="#c77613" stroke-width="8" stroke-linecap="round"/>
    <text x="34" y="236" fill="#596675" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">下载并校验RPM包</text>
    <text x="34" y="270" fill="#596675" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">等待用户确认变更</text>
  </g>

  <line x1="1042" y1="357" x2="1082" y2="357" stroke="#596675" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(1092 212)">
    <rect width="236" height="290" rx="8" fill="#ffffff" stroke="#ced5dc" stroke-width="2"/>
    <rect width="236" height="12" rx="6" fill="#44b678"/>
    <circle cx="48" cy="64" r="24" fill="#e4f6ec"/>
    <text x="48" y="72" text-anchor="middle" fill="#2f8f5b" font-family="Arial, sans-serif" font-size="24" font-weight="700">4</text>
    <text x="88" y="70" fill="#171a1f" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">完成安装</text>
    <rect x="42" y="105" width="152" height="82" rx="6" fill="#e4f6ec" stroke="#44b678" stroke-width="2"/>
    <path d="M76 145L101 168L161 113" fill="none" stroke="#2f8f5b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="236" fill="#596675" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">写入系统文件</text>
    <text x="30" y="270" fill="#596675" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">记录安装状态</text>
  </g>

  <rect x="72" y="558" width="1256" height="92" rx="8" fill="#171a1f"/>
  <text x="108" y="614" fill="#44b678" font-family="Consolas, monospace" font-size="22">user@linux:~$</text>
  <text x="290" y="614" fill="#e7ecf1" font-family="Consolas, monospace" font-size="22">sudo yum install -y vim</text>
  <text x="1264" y="614" text-anchor="end" fill="#8d98a5" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">-y 自动确认安装提示</text>
</svg>
